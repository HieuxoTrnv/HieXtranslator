<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Tools — Công cụ cho nhà đầu tư chứng khoán</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>📈 Stock Tools</h1>
    <nav>
      <button data-tab="compound">Lãi kép</button>
      <button data-tab="dca">DCA</button>
      <button data-tab="dividend">Cổ tức</button>
      <button data-tab="screener">Screener</button>
      <button data-tab="watchlist">Watchlist</button>
      <button data-tab="journal">Nhật ký</button>
      <button data-tab="checklist">Checklist</button>
      <button data-tab="drawdown">Drawdown</button>
    </nav>
  </header>

  <main>
    <!-- LÃI KÉP -->
    <section id="compound" class="tab active">
      <h2>Máy tính lãi kép</h2>
      <label>Số tiền ban đầu (VNĐ): <input type="number" id="c-initial" value="100000000"></label>
      <label>Góp thêm mỗi năm: <input type="number" id="c-yearly" value="0"></label>
      <label>Lãi suất/năm (%): <input type="number" id="c-rate" value="12" step="0.1"></label>
      <label>Số năm: <input type="number" id="c-years" value="20"></label>
      <button onclick="calcCompound()">Tính</button>
      <div id="c-result"></div>
      <canvas id="c-chart"></canvas>
    </section>

    <!-- DCA -->
    <section id="dca" class="tab">
      <h2>Máy tính DCA (trung bình giá)</h2>
      <label>Số tiền mỗi tháng: <input type="number" id="d-monthly" value="10000000"></label>
      <label>Lãi suất/năm (%): <input type="number" id="d-rate" value="12" step="0.1"></label>
      <label>Số năm: <input type="number" id="d-years" value="10"></label>
      <button onclick="calcDCA()">Tính</button>
      <div id="d-result"></div>
      <canvas id="d-chart"></canvas>
    </section>

    <!-- CỔ TỨC -->
    <section id="dividend" class="tab">
      <h2>Máy tính cổ tức</h2>
      <label>Giá mua (VNĐ): <input type="number" id="dv-price" value="25000"></label>
      <label>Cổ tức/năm (VNĐ/cp): <input type="number" id="dv-div" value="1500"></label>
      <label>Số cổ phiếu: <input type="number" id="dv-shares" value="1000"></label>
      <label>Tăng trưởng cổ tức (%/năm): <input type="number" id="dv-growth" value="5" step="0.1"></label>
      <label>Số năm: <input type="number" id="dv-years" value="10"></label>
      <button onclick="calcDividend()">Tính</button>
      <div id="dv-result"></div>
    </section>

    <!-- SCREENER -->
    <section id="screener" class="tab">
      <h2>Screener cổ phiếu</h2>
      <div class="filters">
        <label>P/E tối đa: <input type="number" id="s-pe" value="20"></label>
        <label>P/B tối đa: <input type="number" id="s-pb" value="3" step="0.1"></label>
        <label>ROE tối thiểu (%): <input type="number" id="s-roe" value="15"></label>
        <label>Cổ tức tối thiểu (%): <input type="number" id="s-yield" value="3" step="0.1"></label>
      </div>
      <button onclick="runScreener()">Lọc</button>
      <div id="s-result"></div>
    </section>

    <!-- WATCHLIST -->
    <section id="watchlist" class="tab">
      <h2>Watchlist</h2>
      <div>
        <input type="text" id="w-symbol" placeholder="Mã CK (VD: VCB)">
        <input type="number" id="w-price" placeholder="Giá">
        <button onclick="addWatch()">Thêm</button>
      </div>
      <table id="w-table">
        <thead><tr><th>Mã</th><th>Giá</th><th>Ngày thêm</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- NHẬT KÝ -->
    <section id="journal" class="tab">
      <h2>Nhật ký giao dịch</h2>
      <div>
        <input type="text" id="j-symbol" placeholder="Mã CK">
        <select id="j-action"><option>MUA</option><option>BÁN</option></select>
        <input type="number" id="j-price" placeholder="Giá">
        <input type="number" id="j-qty" placeholder="Số lượng">
        <input type="text" id="j-reason" placeholder="Lý do">
        <button onclick="addJournal()">Ghi</button>
      </div>
      <table id="j-table">
        <thead><tr><th>Ngày</th><th>Mã</th><th>HĐ</th><th>Giá</th><th>SL</th><th>Lý do</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <button onclick="exportJournal()">Export JSON</button>
    </section>

    <!-- CHECKLIST -->
    <section id="checklist" class="tab">
      <h2>Checklist trước khi mua</h2>
      <div id="cl-list"></div>
      <button onclick="evalChecklist()">Đánh giá</button>
      <div id="cl-result"></div>
    </section>

    <!-- DRAWDOWN -->
    <section id="drawdown" class="tab">
      <h2>Mô phỏng drawdown</h2>
      <label>Giá trị danh mục (VNĐ): <input type="number" id="dd-value" value="100000000"></label>
      <label>Mức giảm (%): <input type="number" id="dd-drop" value="30"></label>
      <button onclick="calcDrawdown()">Tính</button>
      <div id="dd-result"></div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/compound.js"></script>
  <script src="js/dca.js"></script>
  <script src="js/dividend.js"></script>
  <script src="js/screener.js"></script>
  <script src="js/watchlist.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/checklist.js"></script>
  <script src="js/drawdown.js"></script>
</body>
</html>
